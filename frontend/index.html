<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英语口语陪练</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<!-- ── Scenario Picker ─────────────────────────── -->
<div id="picker">
  <button id="history-btn" title="查看评分历史">↗ 历史</button>
  <div class="picker-header">
    <h1>🎙 英语口语陪练</h1>
    <p>选择一个场景，开始练习</p>
    <fieldset id="dialect-picker">
      <legend>发音偏好</legend>
      <label>
        <input type="radio" name="dialect" value="en-us" checked />
        <span>美式</span>
      </label>
      <label>
        <input type="radio" name="dialect" value="en-gb" />
        <span>英式</span>
      </label>
    </fieldset>
  </div>
  <div id="scenario-grid"><!-- filled by JS --></div>
</div>

<!-- ── Score History ──────────────────────────── -->
<div id="history-view" class="hidden">
  <header id="history-header">
    <button id="history-back-btn" title="返回场景">← 返回</button>
    <div>
      <h1>评分历史</h1>
      <p id="history-subtitle">查看练习表现与进步趋势</p>
    </div>
  </header>
  <div id="history-content">
    <section id="history-stats"></section>
    <section id="history-trend">
      <div class="history-section-head">
        <div>
          <h2>成绩趋势</h2>
          <span id="history-demo-badge" class="hidden">演示数据</span>
        </div>
        <select id="history-metric" aria-label="选择趋势指标">
          <option value="overall">综合</option>
          <option value="pronunciation">发音</option>
          <option value="fluency">流利度</option>
          <option value="grammar">语法</option>
          <option value="responsiveness">反应速度</option>
        </select>
      </div>
      <div class="history-chart-wrap">
        <canvas id="history-chart"></canvas>
      </div>
    </section>
    <section id="history-records">
      <div class="history-section-head"><h2>练习记录</h2></div>
      <div id="history-list"></div>
    </section>
  </div>
</div>

<!-- ── Session View ────────────────────────────── -->
<div id="session-view" class="hidden">
  <header id="session-header">
    <button id="back-btn" title="换场景">← 返回</button>
    <h1 id="session-title"></h1>
    <span id="session-badge"></span>
    <button id="finish-btn">结束课程</button>
  </header>

  <main>
    <!-- Left: scenario guide + task checklist -->
    <section id="guide-panel">
      <div id="guide-content"></div>
      <div id="task-list"></div>
    </section>

    <!-- Centre: chat -->
    <section id="chat-panel">
      <div id="messages"></div>
      <div id="controls">
        <button id="record-btn">🎤 按住说话</button>
        <span id="status"></span>
        <span id="kb-hint">或按 <kbd>Space</kbd></span>
      </div>
    </section>

    <!-- Right: corrections -->
    <section id="correction-panel">
      <h2>即时纠错</h2>
      <div id="corrections"><p class="empty-hint">对话后显示纠错建议</p></div>
    </section>
  </main>

  <!-- Summary (appears below after finish) -->
  <section id="summary-panel" class="hidden">
    <h2>📊 课后总结</h2>
    <div id="scores"></div>
    <div id="word-scores"></div>
    <canvas id="timing-chart" height="80"></canvas>
    <p id="comment"></p>
  </section>
</div>

<script src="/static/app.js"></script>
</body>
</html>
